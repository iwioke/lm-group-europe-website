server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # CSS and SVG: 1-hour cache, browser revalidates after. Bumping ?v= in HTML busts immediately.
    location ~* \.(css|svg)$ {
        access_log off;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Heavy static assets that rarely change: long cache.
    location ~* \.(mp4|webm|woff2|woff|ttf|jpg|jpeg|png|webp|ico)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # HTML: never cache so deploys propagate instantly.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
